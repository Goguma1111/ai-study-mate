# 서버가 실행될 포트 (프론트는 보통 5173번, 백엔드는 8081번을 씁니다)
server:
  port: 8081

spring:
  datasource:
    # 로컬에 설치한 MySQL 접속 정보. DB 이름은 미리 만들어둔 ai_study_mate 로 가정합니다.
    # (터미널에서: mysql -u root -p 로 접속 후 "CREATE DATABASE ai_study_mate;" 실행)
    url: jdbc:mysql://localhost:8080/ai_study_mate?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      # update: 엔티티 클래스가 바뀌면 테이블도 자동으로 맞춰줌 (개발 단계에서만 사용, 운영에서는 위험)
      ddl-auto: update
    show-sql: true       # 실행되는 SQL을 콘솔에 보여줌 (디버깅에 매우 유용)
    properties:
      hibernate:
        format_sql: true # SQL을 보기 좋게 줄바꿈해서 출력
